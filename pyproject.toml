[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamworker"
version = "0.1.0"
description = "A small, reliable asyncio background job library on Redis Streams."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Yagnang Vyas" }]
classifiers = [
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = ["redis>=5"]

[project.optional-dependencies]
admin = ["fastapi", "uvicorn"]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "httpx",
    "fastapi",
    "uvicorn",
]

[project.scripts]
streamworker = "streamworker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/streamworker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires a real Redis server"]

[tool.coverage.run]
branch = true
source = ["streamworker"]
parallel = true
concurrency = ["thread", "multiprocessing"]
sigterm = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
