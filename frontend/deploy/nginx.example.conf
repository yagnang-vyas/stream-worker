# Example only: serve the built console and proxy /api to ONE fixed admin API upstream.
# Same-origin hosting is required because the admin API sends no CORS headers.
# Terminate TLS here (or in front); the X-API-Key header must never travel over plain HTTP.
server {
    listen 443 ssl;
    server_name ops.example.com;
    # ssl_certificate / ssl_certificate_key ...

    root /srv/streamworker-console;   # contents of frontend/dist
    index index.html;

    location /api/ {
        # Fixed upstream: never derive this from the request.
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        # Optional extra gate in front of the shared API key (basic auth, SSO, IP allow-list).
        # auth_basic "StreamWorker admin"; auth_basic_user_file /etc/nginx/streamworker.htpasswd;
    }

    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
